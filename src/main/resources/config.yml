# ===== TripleCrates =====
# true  = la clé doit être dans la main principale ; false = n'importe où dans l'inventaire
key-in-hand: true

# Hologramme au-dessus de chaque coffre. Placeholders : <name> <rarity> <chance>
hologram:
  background: transparent   # transparent, #RRGGBB ou #AARRGGBB
  shadow: true              # ombre du texte
  lines:
    - "<name>"
    - "<rarity>"
  text-height: 1.55
  item-height: 2.4
  item-scale: 1.4

# Couleur des éclats qui jaillissent quand la machine à sous s'arrête (id de rareté -> couleur hex)
rarity-colors:
  common: "#55FF55"     # vert
  rare: "#3B8CFF"       # bleu
  epic: "#B03BFF"       # violet
  mythic: "#FF3030"     # rouge
  legendary: "#FF3030"  # ancien id : même couleur que mythic
burst-count: 28         # nombre d'éclats par coffre

# Valeurs par défaut des animations (chaque caisse peut les surcharger via /crates editor)
default-animation:
  explosion-particle: explosion_emitter
  explosion-sound: entity.generic.explode
  trail-particle: cloud
  land-particle: poof
  land-sound: block.anvil.land
  win-particle: totem_of_undying
  win-sound: entity.player.levelup
  # --- 1) la caisse gonfle puis explose
  inflate-ticks: 36      # durée du gonflement
  inflate-scale: 2.0     # taille max avant l'explosion (2.0 = deux fois plus grosse)
  inflate-start-sound: entity.tnt.primed
  inflate-sound: entity.puffer_fish.blow_up
  inflate-particle: smoke
  start-delay: 6         # ticks entre l'explosion de la caisse et la chute des coffres
  # --- 2) chute + rebonds
  fall-height: 14        # blocs
  fall-ticks: 16         # durée de la chute (accélération : "attirés" vers le sol)
  bounce-height: 0.45    # hauteur du premier rebond (0 = pas de rebond)
  side-turn: 0.5         # coffres gauche/droite tournés vers le joueur : 0 = parallèles, 1 = pile face à lui
  chest-yaw-offset: 0    # rotation des coffres : 90, -90 ou 180 si le modèle est tourné dans le mauvais sens
  chest-offset-right: 0  # décale les coffres vers la DROITE du joueur (négatif = gauche), si le modèle n'est pas centré
  chest-offset-forward: 0  # décale les coffres vers l'avant (négatif = vers le joueur)
  # --- 3) machine à sous
  spin-ticks: 50         # durée du défilement du 1er coffre
  spin-stagger: 14       # ticks de plus pour chaque coffre suivant (ils s'arrêtent l'un après l'autre)
  spin-sound: block.note_block.hat
  spin-stop-sound: block.note_block.bell
  reveal-pause: 12       # ticks entre l'arrêt du dernier coffre et le début du choix
  distance: 3.0          # distance devant le joueur
  spacing: 2.4           # écart entre les coffres
  choose-timeout: 30     # secondes (au bout, un coffre est choisi au hasard)
  end-delay: 40          # ticks avant disparition après le choix
  chest-item: CHEST      # item affiché pour les coffres. Coffre Nexo : nexo:storage_chest
  chest-scale: 1.1       # taille du modèle des coffres
  chest-y-offset: auto   # hauteur du centre du modèle ("auto" = taille / 2, le modèle est posé sur le sol)
  chest-item-transform: NONE   # NONE | FIXED | GROUND | HEAD ... si un modèle Nexo apparaît déformé ou mal orienté
  vanish-particle: poof  # nuage quand les coffres disparaissent après le choix
  chest-model-type: NONE # NONE | MYTHICMOBS | MODELENGINE
  chest-model-id: ""

# Interface de prévisualisation (clic gauche sur la caisse)
preview:
  default-title: "<dark_gray>Récompenses • %crate%"
  default-rows: 5
  default-filler: BLACK_STAINED_GLASS_PANE
  lore:
    rarity: "<gray>Rareté : <rarity>"
    chance: "<gray>Chance : <yellow><chance>%"
  # Boutons / décor de l'aperçu (valeurs par défaut, remplaçables entièrement par caisse : preview.items).
  # Chaque entrée : slot (ou slots: liste, ranges "0-8", négatif = depuis la fin), item (matériau | nexo:<id> | base64:...),
  # name, lore, amount, glow, hide-tooltip, action (close | next-page | prev-page | command | none),
  # commands (pour action: command ; préfixes [player] [console] [close]), show (always | has-next | has-prev)
  items:
    prev:
      slot: -9
      item: ARROW
      name: "<yellow>« Page précédente"
      action: prev-page
    next:
      slot: -1
      item: ARROW
      name: "<yellow>Page suivante »"
      action: next-page
    close:
      slot: -5
      item: BARRIER
      name: "<red>Fermer"
      action: close
