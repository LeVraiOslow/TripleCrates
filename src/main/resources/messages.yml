prefix: "<gradient:#f5a623:#f76b1c><bold>Crates</bold></gradient> <dark_gray>»</dark_gray> "
no-permission: "%prefix%<red>Tu n'as pas la permission."
player-only: "%prefix%<red>Commande réservée aux joueurs."
player-not-found: "%prefix%<red>Joueur introuvable."
crate-not-found: "%prefix%<red>Caisse introuvable : <white>%crate%"
key-not-found: "%prefix%<red>Clé introuvable : <white>%key%"
no-key: "%prefix%<red>Il te faut la clé <white>%key%<red> pour ouvrir cette caisse."
no-key-linked: "%prefix%<red>Aucune clé n'est liée à cette caisse."
busy: "%prefix%<red>Cette caisse est déjà en cours d'ouverture."
already-opening: "%prefix%<red>Tu as déjà une ouverture en cours."
empty-crate: "%prefix%<red>Cette caisse ne contient aucune récompense."
choose: "%prefix%<green>Choisis un coffre avec un <white>clic droit<green> !"
chosen: "%prefix%<green>Tu as obtenu : <white>%reward% <gray>(%rarity%<gray>)"
timeout: "%prefix%<yellow>Temps écoulé : un coffre a été choisi au hasard."
broadcast: "%prefix%<white>%player% <gray>a obtenu <white>%reward% <gray>(%rarity%<gray>) dans <white>%crate%<gray> !"
crate-given: "%prefix%<green>Caisse <white>%crate%<green> x%amount% donnée à <white>%player%<green>."
key-given: "%prefix%<green>Clé <white>%key%<green> x%amount% donnée à <white>%player%<green>."
crate-placed: "%prefix%<green>Caisse <white>%crate%<green> posée."
crate-removed: "%prefix%<yellow>Caisse retirée (Shift + casser)."
reloaded: "%prefix%<green>Configuration rechargée."
invalid-number: "%prefix%<red>Nombre invalide."
invalid-item: "%prefix%<red>Item invalide (matériau, nexo:<id>)."
invalid-id: "%prefix%<red>ID invalide (lettres minuscules, chiffres, - et _)."
already-exists: "%prefix%<red>Cet ID existe déjà."
prompt-header: "%prefix%<yellow>%text% <gray>(écris <white>cancel<gray> pour annuler)"
prompt-cancelled: "%prefix%<gray>Annulé."
help:
  - "<gold><bold>TripleCrates"
  - "<yellow>/crates editor <gray>- éditeur en jeu"
  - "<yellow>/crates give <joueur> <caisse> [n] <gray>- donne l'item de la caisse (à poser)"
  - "<yellow>/crates givekey <joueur> <clé> [n] <gray>- donne des clés"
  - "<yellow>/crates open <joueur> <caisse> <gray>- ouvre une caisse sans clé"
  - "<yellow>/crates preview <caisse> [joueur] <gray>- aperçu des récompenses"
  - "<yellow>/crates list <gray>- liste des caisses et clés"
  - "<yellow>/crates reload <gray>- recharge les fichiers"
# Titres des menus (optionnels, valeurs par défaut dans le code) :
